# Publishes the packages to npm (@oim-media/*), pub.dev (oim_flutter) and crates.io
# (oim-media) with trusted publishing (OIDC, no stored token), and builds + attaches
# the Windows desktop viewer installers (.exe / .msi) and the Android Flutter APK to the GitHub Release when
# a tag vX.Y.Z is pushed (or when triggered via workflow_dispatch).
# The tag must name CONTRACT_VERSION. A package version that already exists
# returns 409 and the publish job fails: versions are never overwritten.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching CONTRACT_VERSION (e.g. v1.26.1)'
        required: true
        default: 'v1.26.1'
        type: string

permissions:
  contents: read

jobs:
  # npm trusted publishing only accepts GitHub-hosted runners, so the publish jobs never
  # use CI_RUNNER. Each registry must list this repo and release.yml as a trusted
  # publisher. A version that already exists is refused: versions are never overwritten.
  publish-npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: node tools/versions.mjs "${{ github.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm conformance
      - run: pnpm test:tools
      - run: pnpm check:licenses
      - run: node tools/pack-contents.mjs
      # pnpm pack rewrites workspace: ranges; npm publish then signs with OIDC + provenance.
      - run: |
          mkdir -p "$RUNNER_TEMP/tgz"
          for p in core player-oim player-ovm spec; do (cd "packages/$p" && pnpm pack --pack-destination "$RUNNER_TEMP/tgz"); done
          for t in "$RUNNER_TEMP"/tgz/*.tgz; do npm publish "$t" --access public --provenance; done
      - name: All four packages published
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in core player-oim player-ovm spec; do
            npm view "@oim-media/$p@$v" version >/dev/null || { echo "missing @oim-media/$p@$v"; exit 1; }
          done

  publish-pub:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exchanges the GitHub OIDC token for a pub.dev one (PUB_TOKEN).
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: ./.github/actions/setup-flutter
      - run: |
          cd sdks/flutter
          flutter pub get
          flutter test
          flutter pub publish --force

  publish-crates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: |
          cd sdks/rust
          cargo test
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The binary jobs upload to the release; it exists before any of them ends
  # (v1.27.0: Android, iOS and Windows-Flutter finished before Tauri created it).
  release:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "OIM $tag" --generate-notes

  desktop-windows:
    needs: release
    # Self-hosted Windows runner on Josué's PC when WINDOWS_RUNNER is set.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Validate release tag matches CONTRACT_VERSION
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          node tools/versions.mjs "$tag"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build Windows desktop viewer (.exe and .msi)
        run: pnpm --filter ./apps/viewer-desktop tauri build
      - name: Upload Windows installers to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $cleanTag = $tag -replace '^v',''
          $nsis = Get-Item "apps/viewer-desktop/src-tauri/target/release/bundle/nsis/*.exe"
          $msi = Get-Item "apps/viewer-desktop/src-tauri/target/release/bundle/msi/*.msi"
          $portable = Get-Item "apps/viewer-desktop/src-tauri/target/release/oim-viewer.exe"
          $nsisDest = "OIM.Viewer_${cleanTag}_Tauri_x64-setup.exe"
          $msiDest = "OIM.Viewer_${cleanTag}_Tauri_x64_en-US.msi"
          $portableDest = "oim-viewer_${cleanTag}_Tauri_portable.exe"
          Copy-Item $nsis.FullName $nsisDest
          Copy-Item $msi.FullName $msiDest
          Copy-Item $portable.FullName $portableDest
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" $nsisDest $msiDest $portableDest --title "OIM $tag" --generate-notes
          } else {
            gh release upload "$tag" $nsisDest $msiDest $portableDest --clobber
          }

  mobile-android:
    needs: release
    # The self-hosted runner has the Android SDK in ~/Android (ANDROID_HOME set in the runner's .env).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Build Android APK with Flutter
        run: |
          cd apps/viewer-flutter
          flutter pub get
          flutter build apk --release
      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          clean_tag="${tag#v}"
          apk="apps/viewer-flutter/build/app/outputs/flutter-apk/app-release.apk"
          dest="OIM.Viewer_${clean_tag}_Flutter_Android.apk"
          cp "$apk" "$dest"
          gh release upload "$tag" "$dest" --clobber

  desktop-windows-flutter:
    needs: release
    # Self-hosted Windows runner on Josué's PC when WINDOWS_RUNNER is set.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Build Flutter Windows app and upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $cleanTag = $tag -replace '^v',''
          Set-Location apps/viewer-flutter
          flutter pub get
          flutter build windows --release
          $dest = "OIM.Viewer_${cleanTag}_Flutter_Windows.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $dest -Force
          gh release upload "$tag" $dest --clobber

  mobile-ios:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Build unsigned iOS app with Flutter
        run: |
          cd apps/viewer-flutter
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA and upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          clean_tag="${tag#v}"
          cd apps/viewer-flutter/build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          dest="$GITHUB_WORKSPACE/OIM.Viewer_${clean_tag}_Flutter_iOS_unsigned.ipa"
          zip -qry "$dest" Payload
          cd "$GITHUB_WORKSPACE"
          gh release upload "$tag" "$dest" --clobber
