# Deploys the player built from main to cdn-next.oim.media (Worker oim-cdn-next,
# static assets, config in tools/player-next), so the landing and previews can try it before any release.
# cdn.oim.media keeps serving the pinned stable player; nothing here touches npm.
name: player-next
on:
  push:
    branches: [main]
    paths: ['packages/core/**', 'packages/scene/**', 'packages/player-oim/**', 'pnpm-lock.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-next
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oim-media/player-oim... build
      - run: pnpm --filter @oim-media/player-oim test
      # The same paths as cdn.oim.media, revalidated on every load.
      - run: |
          out=tools/player-next/dist
          mkdir -p "$out/player/v1"
          cp -r packages/player-oim/dist/. "$out/"
          cp -r packages/player-oim/dist/oim-player.js packages/player-oim/dist/vendor packages/player-oim/dist/THIRD_PARTY_NOTICES "$out/player/v1/"
          printf '/*\n  Cache-Control: public, max-age=0, must-revalidate\n  X-Robots-Tag: noindex\n' > "$out/_headers"
          printf "${GITHUB_SHA}\n" > "$out/commit.txt"
      - run: cd tools/player-next && pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAYER_NEXT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
