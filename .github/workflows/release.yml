# Publishes the four @oim-media packages to GitHub Packages when a tag
# vX.Y.Z is pushed. The tag must name CONTRACT_VERSION. A version that already
# exists returns 409 and the job fails: versions are never overwritten.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@oim-media'
      - run: node tools/versions.mjs "${{ github.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm conformance
      - run: pnpm test:tools
      - run: pnpm check:licenses
      - run: node tools/pack-contents.mjs
      - run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # pnpm skips a package silently in some cases; all four must exist.
      - name: All four packages published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in core player-oim player-ovm spec; do
            gh api "orgs/oim-media/packages/npm/$p/versions" --jq '.[].name' | grep -qx "$v" \
              || { echo "missing @oim-media/$p@$v"; exit 1; }
          done
