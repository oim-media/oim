packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  vitest: "^4.1.0"
  happy-dom: "^21.0.4"
  vite: "^8.1.6"
  esbuild: "^0.25.0"
  undici: ">=8.12.2 <9"
  fast-uri: ">=3.1.9 <4"
  source-map-js: ">=1.2.2 <2"

# Dependency build scripts (supply-chain defence): only esbuild needs one, for vite.
allowBuilds:
  esbuild: true
