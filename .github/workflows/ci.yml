# Tests, type check, the conformance gate and the publishing guards on every
# push and PR. `vars.CI_RUNNER` sends jobs to a self-hosted runner; without it,
# GitHub's. Actions are pinned by SHA: a moved tag cannot change what runs.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # A pull request from a fork never reaches the self-hosted runner: its code
    # would run on our machine. Forks get GitHub's runner.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm conformance
      - run: pnpm test:tools
      - run: pnpm check:licenses
      - run: node tools/pack-contents.mjs

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Test Flutter SDK & Conformance
        run: |
          cd sdks/flutter
          flutter pub get
          flutter analyze
          flutter test
      - name: Test Viewer Flutter App
        run: |
          cd apps/viewer-flutter
          flutter pub get
          flutter analyze
          flutter test
