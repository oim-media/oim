# Publishes the four @oim-media packages to GitHub Packages when a tag
# vX.Y.Z is pushed. The tag must name CONTRACT_VERSION. A version that already
# exists returns 409 and the job fails: versions are never overwritten.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@oim-media'
      - run: node tools/versions.mjs "${{ github.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm conformance
      - run: pnpm test:tools
      - run: pnpm check:licenses
      - run: node tools/pack-contents.mjs
      # pnpm 11 does not read the user .npmrc that setup-node writes, so the
      # token goes into the project one, inside the job only (never committed).
      - run: |
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # pnpm skips a package silently in some cases; all four must exist.
      - name: All four packages published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in core player-oim player-ovm spec; do
            versions=$(gh api --paginate "orgs/oim-media/packages/npm/$p/versions" --jq '.[].name')
            grep -qx "$v" <<< "$versions" || { echo "missing @oim-media/$p@$v"; exit 1; }
          done
