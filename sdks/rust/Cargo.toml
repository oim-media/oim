[package]
name = "oim-media"
version = "1.27.9"
edition = "2024"
license = "Apache-2.0"
description = "Read, verify and interpret .oim files"
repository = "https://github.com/oim-media/oim"

# Package name differs because "oim" is taken on crates.io; code still imports `oim::`.
[lib]
name = "oim"

[dependencies]
base64 = "0.22"
flate2 = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
ryu-js = "1"
# float_roundtrip: without it serde_json may parse a decimal one bit off and the
# canonical bytes stop matching the signer's.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
